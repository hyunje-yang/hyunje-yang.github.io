# ----------------------------------------------------------------------------- RESEARCH GALLERY (Academics 페이지의 사진 딸린 프로젝트)
research_gallery:
  - title: A Study on the Quantification and Promotion of Forest Water Yield for Sustainable Supply of Freshwater
    bullets:
      - Calibrate interest parameters and analyze their uncertainties on physical hydrological simulation model via Bayesian approach and Generalized Likelihood Uncertainty Estimation (GLUE), using in situ measurement of the water cycle in different forest stands.
      - Investigated forest stand characteristics and collected soil samples in various forested areas.
      - Installed various hydrological instruments and collected in situ datasets via datalogger, water level gauge, sap flow measure, and automatic water sampler.
    images:
      - img/research/research-01.jpg
      - img/research/research-02.jpg
      - img/research/research-03.png
      - img/research/research-04.jpg
      - img/research/research-05.jpg
      - img/research/research-06.jpg

  - title: Estimation of Forest Soil Hydraulic Characteristics Based on the National Scale Forest Geographic Information
    bullets:
      - "Soil hydraulic characteristics measurement: soil water holding capacities (using pressure plate), hydraulic conductivity, organic matter, and soil texture analysis."
      - Soil hydraulic properties prediction and its predictive uncertainty estimation on a national scale based on spatial big dataset and machine learning prediction models.
      - Priority sample site selection to strengthen the Digital Soil Mapping (DSM) model for a 10-year national R&D research project using predictive uncertainty.
    images:
      - img/research/research-07.png
      - img/research/research-08.png
      - img/research/research-09.png
      - img/research/research-10.png
      - img/research/research-11.jpg
      - img/research/research-12.jpg

  - title: Long-term Monitoring of the Flow Characteristics in Different Forest Stands and Locations
    bullets:
      - Select the optimal sites for water level gauge dams in different forest sites, and survey the sites to install the dam.
      - Construction management of the water level gauge dam.
      - Collect the long-term water level and meteorological data from 52 sites and compare their hydrological characteristics.
      - Evaluate the effect of forest thinning on the forest water cycle changes based on double mass curves and nonparametric statistics.
