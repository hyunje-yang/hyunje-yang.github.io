# ----------------------------------------------------------------------------- RESEARCH EXPERIENCE
# 홈 화면의 연표와 CV의 RESEARCH EXPERIENCE 를 함께 만듭니다.
research_experience:
  - org: Oak Ridge National Laboratory
    logo: img/logos/ornl.svg          # 홈 화면에서 이 기관 뒤에 은은하게 깔린다
    abbr: ORNL
    location: Oak Ridge, TN, USA
    role: Graduate Research Intern
    period: May 2026 - Jul. 2026
    start: 2026-05
    end: 2026-07
    projects:
      - title: Artificial Intelligence for Advancing Coastal Resilience (Ongoing Research Collaboration)
        period: May 2026 - Present
        start: 2026-05
        bullets:
          - Developed a geometry-aware neural operator for cross-regional storm surge prediction across diverse coastal geometries.
          - Investigated the impacts of hurricanes on coastal wetland ecosystems.
          - Developed a diffusion-based storm surge reconstruction model to generate time series storm surge.

  - org: The University of Texas at Austin
    logo: img/logos/ut-austin.png          # 홈 화면에서 이 기관 뒤에 은은하게 깔린다
    abbr: UT Austin
    location: Austin, TX, USA
    role: Ph.D. Student, Civil, Architectural and Environmental Engineering
    period: Aug. 2023 - Present
    start: 2023-08
    end: null
    note: UT Austin Engineering Fellowship, Cockrell School of Engineering and UT Austin Graduate School
    note_in_cv: false          # EDUCATION 에 이미 있으므로 CV(docx)에서는 생략
    projects:
      - title: Physics-Informed Machine Learning for Compound Flooding Prediction
        period: May 2025 - Present
        start: 2025-05
        bullets:
          - Utilizing the SFINCS (Super-Fast INundation of CoastS) model to generate training data.
          - Incorporating governing physics constraints, including mass and momentum conservation equations, into state-of-the-art deep learning models to improve physical consistency and predictive accuracy.

      - title: Integration of Machine Learning and Static Flood Models for Coastal Inundation Simulation
        period: Aug. 2023 - Dec. 2025
        start: 2023-08
        bullets:
          - Developed a hybrid model (C1PK-Flood) integrating a machine learning-based storm surge prediction model (C1PKNet) and a static flood model (MatFlood) to rapidly generate high-resolution storm surge inundation maps.
          - Proposed a novel method to optimize time series inputs of tropical cyclone parameters.

      - title: Reconstruction of Missing Data for Hurricane-Damaged Buildings using XGBoost
        period: Aug. 2023 - Aug. 2024
        start: 2023-08
        bullets:
          - Developed an imputation model using structural, geospatial, hazard, and damage level data to reconstruct missing attributes of hurricane-damaged buildings.
          - Assessed model performance across different regions and identified key features to support post-disaster building assessments.

  - org: National Institute of Forest Science
    logo: img/logos/nifos.png          # 홈 화면에서 이 기관 뒤에 은은하게 깔린다
    abbr: NIFoS
    location: Seoul, South Korea
    role: Researcher, Forest Environment and Conservation Department
    period: Mar. 2018 - Apr. 2023
    start: 2018-03
    end: 2023-04
    note: "[Government R&D Projects]"
    projects:
      - title: Establishment of Big Data and Integrated Utilization System for Flash Floods in Forest Watershed
        period: Mar. 2021 - Apr. 2023
        start: 2021-03
        bullets:
          - Develop flash flood forecasting models using time series flood datasets and machine learning approaches.
          - Find the optimal devices and algorithms for flash flood warning systems suited to forested areas.

      - title: Development of Forest Water Management Technology to Reduce Stream Depletion and Nonpoint Source Pollution
        period: Mar. 2021 - Apr. 2023
        start: 2021-03
        bullets:
          - Monitor and collect data on changes in water quality after forest fire and forest thinning as the preliminary stage for analysis.

      - title: Quantification and Improvement of Forest Water Yield for Sustainable Supply of Freshwater
        period: Mar. 2018 - Apr. 2023
        start: 2018-03
        bullets:
          - Calibrate interest parameters and analyze their uncertainties on physical hydrological simulation model via Bayesian approach and Generalized Likelihood Uncertainty Estimation (GLUE), using in situ measurement of the water cycle in different forest stands.
          - Collect hydrological monitoring data for hydrograph analysis; compared various estimation methods to quantify the baseflow most rationally from streamflow in forested catchments.
          - Estimate the soil hydraulic properties and predictive uncertainties based on a national scale spatial big dataset using machine learning models; examined the influence of environmental features on soil properties through sensitivity analysis.
        note: Selected as a 10-year national R&D project with a $2.8M grant/year.

      - title: Long-term Monitoring of Flow Characteristics in Different Forest Stands and Locations
        period: Mar. 2018 - Apr. 2023
        start: 2018-03
        bullets:
          - Collect the long-term water level and meteorological data from 52 sites and compare their hydrological characteristics.
          - Evaluate the effect of forest thinning on the forest water cycle changes based on double mass curves and nonparametric statistics.

  - org: Seoul National University
    logo: img/logos/snu.png          # 홈 화면에서 이 기관 뒤에 은은하게 깔린다
    abbr: SNU
    location: Seoul, South Korea
    role: Researcher, Department of Forest Environmental Science
    period: Jun. 2013 - Feb. 2018
    start: 2013-06
    end: 2018-02
    projects:
      - title: Hydraulic Relation of Discharge and Velocity in Mountain Streams Using Salt Dilution Method
        period: Mar. 2016 - Feb. 2018
        start: 2016-03
        bullets:
          - Measured in situ stream mean velocity and discharge via salt dilution; developed a mean velocity prediction formula based on forested topographical information and stream discharge using a nondimensionalized equation.

      - title: Monitoring of Floods in Mountainous Areas and Critical Runoffs in Urban Areas
        period: Jun. 2013 - Feb. 2016
        start: 2013-06
        bullets:
          - Joined the 5th CALS Research Fellowship Program as an undergraduate researcher.
          - Measured in situ streambed materials and organized flash flood velocity data in urban areas.

