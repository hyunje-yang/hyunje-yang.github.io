# main 브랜치에 push 하면 자동으로 사이트를 굽고 GitHub Pages 에 올린다.
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # CV(docx→PDF) 변환은 Windows 의 Word 가 필요하므로 여기서는 건너뛴다.
      # assets/pdf/ 안의 CV 는 로컬에서 만들어 저장소에 함께 올린다.
      - run: python build.py --no-cv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
